server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/metadata-editor/editor;
    index index.php index.html;

    charset utf-8;

    # Security headers (mirrors upstream .htaccess)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Block direct web access to sensitive directories and files
    location ~ ^/(system|application|modules|deploy|tests)/ {
        deny all;
        return 404;
    }

    location ~ ^/(datafiles|logs)/ {
        deny all;
        return 404;
    }

    location ~* (composer\.json|composer\.lock|worker\.sh|worker\.bat|web\.config|\.git|\.env) {
        deny all;
        return 404;
    }

    # Deny hidden files (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Main front-controller routing (Clean URLs + standard /index.php/... URLs)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle PHP scripts including PATH_INFO / segment-based URLs (/index.php/api/...)
    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }

        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";

        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;

        # Generous timeouts for large imports and synchronous FastAPI calls
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        fastcgi_connect_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Static assets caching
    location ~* \.(css|js|gif|ico|jpeg|jpg|png|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }
}
