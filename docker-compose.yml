# ==============================================================================
# World Bank Metadata Editor — Docker Compose Stack (Quick Start & Development)
# ==============================================================================
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#
# Services:
#   - editor  : Metadata Editor Web UI + REST API (PHP 8.2-FPM + Nginx)
#   - worker  : Background job queue worker (php index.php cli/worker/run)
#   - fastapi : Companion data processing service (Python 3.12 + FastAPI)
#   - db      : MySQL 8.0 database
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Database Service (MySQL 8.0)
  # ----------------------------------------------------------------------------
  db:
    image: ${DB_IMAGE:-mysql:8.0}
    container_name: metadata-editor-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --wait-timeout=28800
      - --max-allowed-packet=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-metadata_editor}
      MYSQL_USER: ${DB_USER:-editor_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-editor_change_me}
      TZ: ${TZ:-UTC}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - metadata_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 2. FastAPI Companion Service (Microdata, Summary Stats, DuckDB Timeseries)
  # ----------------------------------------------------------------------------
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
      args:
        FASTAPI_REPO: ${FASTAPI_REPO:-worldbank/metadata-editor-fastapi}
        FASTAPI_VERSION: ${FASTAPI_VERSION:-latest}
        INSTALL_REVIEWER: ${INSTALL_REVIEWER:-false}
    image: worldbank-metadata-editor-fastapi:${FASTAPI_VERSION:-latest}
    container_name: metadata-editor-fastapi
    restart: unless-stopped
    environment:
      STORAGE_PATH: /var/www/metadata-editor/editor/datafiles
      HOST: 0.0.0.0
      PORT: 8000
      TZ: ${TZ:-UTC}
    volumes:
      # Shared at the exact same absolute path as the editor & worker containers
      - editor_datafiles:/var/www/metadata-editor/editor/datafiles
      - fastapi_logs:/var/www/metadata-editor/fastapi/logs
    networks:
      - metadata_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/status >/dev/null || curl -fsS http://127.0.0.1:8000/docs >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 3. Metadata Editor Web UI & REST API (Nginx + PHP 8.2-FPM)
  # ----------------------------------------------------------------------------
  editor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EDITOR_REPO: ${EDITOR_REPO:-worldbank/metadata-editor}
        EDITOR_VERSION: ${EDITOR_VERSION:-latest}
    image: worldbank-metadata-editor:${EDITOR_VERSION:-latest}
    container_name: metadata-editor-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-UTC}
      # Database connection
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-metadata_editor}
      DB_USER: ${DB_USER:-editor_user}
      DB_PASSWORD: ${DB_PASSWORD:-editor_change_me}
      DB_DEBUG: ${DB_DEBUG:-false}
      # Application & URL settings
      APP_BASE_URL: ${APP_BASE_URL:-}
      CLEAN_URLS: ${CLEAN_URLS:-true}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-ChangeThisEncryptionKeyInProd99!}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      LOG_THRESHOLD: ${LOG_THRESHOLD:-1}
      # Storage & FastAPI integration
      EDITOR_STORAGE_PATH: /var/www/metadata-editor/editor/datafiles/editor
      EDITOR_DATA_API_URL: http://fastapi:8000/
      # PHP runtime limits
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-300}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-2000M}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-2000M}
      # Auto-installation & migrations
      AUTO_INSTALL: ${AUTO_INSTALL:-true}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Site}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Administrator}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # Outbound Email (SMTP)
      SMTP_PROTOCOL: ${SMTP_PROTOCOL:-smtp}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_EMAIL: ${SMTP_EMAIL:-noreply@example.org}
      SMTP_CRYPTO: ${SMTP_CRYPTO:-}
      SMTP_AUTH: ${SMTP_AUTH:-}
    volumes:
      - editor_datafiles:/var/www/metadata-editor/editor/datafiles
      - editor_files:/var/www/metadata-editor/editor/files
      - editor_logs:/var/www/metadata-editor/editor/logs
    networks:
      - metadata_net

  # ----------------------------------------------------------------------------
  # 4. Background Queue Worker (Processes /api/jobs/*, PDF, NADA publish, imports)
  # ----------------------------------------------------------------------------
  worker:
    image: worldbank-metadata-editor:${EDITOR_VERSION:-latest}
    container_name: metadata-editor-worker
    restart: always
    pid: "service:editor"
    depends_on:
      editor:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    command: ["worker"]
    environment:
      TZ: ${TZ:-UTC}
      SKIP_DB_BOOTSTRAP: "true"
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-metadata_editor}
      DB_USER: ${DB_USER:-editor_user}
      DB_PASSWORD: ${DB_PASSWORD:-editor_change_me}
      EDITOR_STORAGE_PATH: /var/www/metadata-editor/editor/datafiles/editor
      EDITOR_DATA_API_URL: http://fastapi:8000/
      PHP_MEMORY_LIMIT: ${WORKER_MEMORY_LIMIT:-1024M}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5}
      WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-50}
      SMTP_PROTOCOL: ${SMTP_PROTOCOL:-smtp}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_EMAIL: ${SMTP_EMAIL:-noreply@example.org}
      SMTP_CRYPTO: ${SMTP_CRYPTO:-}
      SMTP_AUTH: ${SMTP_AUTH:-}
    volumes:
      - editor_datafiles:/var/www/metadata-editor/editor/datafiles
      - editor_files:/var/www/metadata-editor/editor/files
      - editor_logs:/var/www/metadata-editor/editor/logs
    networks:
      - metadata_net
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/metadata-editor/editor/datafiles/editor/tmp/worker.heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mysql_data:
    name: ${COMPOSE_PROJECT_NAME:-metadata_editor}_mysql_data
  editor_datafiles:
    name: ${COMPOSE_PROJECT_NAME:-metadata_editor}_datafiles
  editor_files:
    name: ${COMPOSE_PROJECT_NAME:-metadata_editor}_files
  editor_logs:
    name: ${COMPOSE_PROJECT_NAME:-metadata_editor}_logs
  fastapi_logs:
    name: ${COMPOSE_PROJECT_NAME:-metadata_editor}_fastapi_logs

networks:
  metadata_net:
    name: ${COMPOSE_PROJECT_NAME:-metadata_editor}_net
    driver: bridge
